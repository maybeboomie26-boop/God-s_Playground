```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050509;color:#fff;font-family:Arial,sans-serif}
body{
background:
radial-gradient(circle at 15% 20%,rgba(120,70,255,.18),transparent 28%),
radial-gradient(circle at 85% 75%,rgba(0,180,255,.13),transparent 30%),
radial-gradient(circle at 50% 50%,rgba(255,0,130,.06),transparent 35%),
linear-gradient(135deg,#030308,#080812 45%,#03050a);
}
.container{position:relative;width:100%;height:100%}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.glow.one{width:280px;height:280px;background:#703cff;left:5%;top:10%}
.glow.two{width:340px;height:340px;background:#0066ff;right:5%;bottom:5%}
.glow.three{width:180px;height:180px;background:#ff1683;left:45%;top:35%}
.grid{
position:absolute;
inset:-100px;
background-image:
linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
background-size:45px 45px;
transform:perspective(500px) rotateX(55deg) scale(1.4);
transform-origin:center bottom;
opacity:.5;
}
.noise{
position:absolute;
inset:0;
opacity:.035;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}
.lines{position:absolute;inset:0;overflow:hidden}
.line{
position:absolute;
height:1px;
width:70%;
background:linear-gradient(90deg,transparent,rgba(130,100,255,.5),transparent);
transform:rotate(-25deg);
opacity:.3;
}
.line:nth-child(1){top:15%;left:-10%}
.line:nth-child(2){top:35%;left:30%;transform:rotate(20deg)}
.line:nth-child(3){top:65%;left:-20%;transform:rotate(-15deg)}
.line:nth-child(4){top:80%;left:40%;transform:rotate(30deg)}
.line:nth-child(5){top:48%;left:-10%;transform:rotate(5deg)}
.orb{
position:absolute;
width:9px;
height:9px;
border-radius:50%;
background:#fff;
box-shadow:0 0 10px #fff,0 0 25px #7c5cff,0 0 50px #7c5cff;
opacity:.7;
}
.orb:nth-child(1){left:17%;top:28%}
.orb:nth-child(2){left:72%;top:18%}
.orb:nth-child(3){left:82%;top:64%}
.orb:nth-child(4){left:28%;top:76%}
.orb:nth-child(5){left:54%;top:44%}
.orb:nth-child(6){left:91%;top:36%}
.circle{
position:absolute;
border:1px solid rgba(255,255,255,.06);
border-radius:50%;
}
.circle.a{width:500px;height:500px;left:-150px;bottom:-220px}
.circle.b{width:700px;height:700px;right:-300px;top:-350px}
.circle.c{width:300px;height:300px;left:50%;top:50%;transform:translate(-50%,-50%);border-color:rgba(120,90,255,.08)}
.center{
position:absolute;
left:50%;
top:50%;
width:70vw;
height:70vw;
max-width:900px;
max-height:900px;
transform:translate(-50%,-50%);
border-radius:50%;
background:radial-gradient(circle,rgba(90,60,255,.035),transparent 65%);
box-shadow:inset 0 0 100px rgba(100,80,255,.025);
}
.fade{
position:absolute;
inset:0;
background:
linear-gradient(90deg,rgba(0,0,0,.3),transparent 30%,transparent 70%,rgba(0,0,0,.3)),
linear-gradient(0deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.2));
}
</style>
</head>
<body>
<div class="container">
<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>
<div class="center"></div>
<div class="grid"></div>
<div class="lines">
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
</div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="circle a"></div>
<div class="circle b"></div>
<div class="circle c"></div>
<div class="noise"></div>
<div class="fade"></div>
</div>
</body>
</html>
